<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>W.L.R Command Personnel</title>
    <script>
      (function () {
        var path = location.pathname + location.search + location.hash;
        if (/(^|\/)app(\/|$)/.test(location.pathname)) {
          try {
            sessionStorage.setItem('wlr-spa-path', path);
          } catch (error) {}
          var marker = '/app';
          var at = location.pathname.indexOf(marker);
          var prefix = at > 0 ? location.pathname.slice(0, at) : '';
          location.replace((prefix || '') + '/react.html');
          return;
        }
      })();
    </script>
  </head>
  <body></body>
</html>
