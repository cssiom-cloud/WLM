<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHITE LION REGIMENT Tactical Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="./css/design-system.css?v=nav-rail">
    <link rel="stylesheet" href="./css/animations.css?v=nav-rail">
    <link rel="stylesheet" href="./css/components.css?v=ops-board">
    <script>
      (function () {
        var theme = localStorage.getItem('wlr-command-theme');
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
        var accent = localStorage.getItem('wlr-command-accent');
        if (accent) document.documentElement.style.setProperty('--accent', accent);
      })();
    </script>
  </head>
  <body>
    <div class="page-shell">
      <header id="command-header"></header>
      <main class="page-content">
        <div class="toolbar-row">
          <div>
            <p class="page-kicker" data-i18n="ops.kicker">Operations</p>
            <h1 class="page-title" data-i18n="ops.title">Tactical Operations &amp; AAR Board</h1>
            <p class="page-lead" data-i18n="ops.lead">Official operation briefs, annotated maps, and after-action evaluations.</p>
          </div>
          <a id="create-operation-link" class="btn btn-primary" href="./operation-create.html" data-i18n="ops.create" hidden>Create Operation</a>
        </div>
        <p id="status-banner" class="status-banner" role="status"></p>
        <section id="operation-list" class="ops-list" aria-busy="true" aria-label="Operations"></section>
        <p id="operation-empty" class="empty-log" data-i18n="ops.empty" hidden>No operations have been posted yet.</p>
      </main>
    </div>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script type="module" src="./js/operations.js"></script>
  </body>
</html>
